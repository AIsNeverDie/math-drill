<svg xmlns="http://www.w3.org/2000/svg" viewBox="-112 -232 224 240" aria-hidden="true">
  <defs>
    <style>
      .dk-l, .dk-t { stroke: #1b1d4d; stroke-linecap: round; stroke-linejoin: round; }
      .dk-l { stroke-width: 3.4px; }
      .dk-t { stroke-width: 1.8px; }
      
      /* 呼吸与身体起伏动画 */
      @keyframes dk-breathe {
        0%, 100% { transform: translateY(0) scale(1, 1); }
        50% { transform: translateY(-5px) scale(0.97, 1.025); }
      }
      
      /* 眨眼动画：每 2.5 秒眨一次 */
      @keyframes dk-blink {
        0%, 88%, 96%, 100% { transform: scale(1, 1); }
        92% { transform: scale(1, 0.08); }
      }
      
      /* 阴影随呼吸收放 */
      @keyframes dk-shadow {
        0%, 100% { transform: scale(1, 1); opacity: 0.14; }
        50% { transform: scale(0.9, 0.9); opacity: 0.09; }
      }
      
      /* 两侧耳朵随身体起伏微摆 */
      @keyframes dk-ear-l {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(-3deg); }
      }
      @keyframes dk-ear-r {
        0%, 100% { transform: rotate(0deg); }
        50% { transform: rotate(3deg); }
      }

      .dk-body-wrap {
        transform-origin: 0 0;
        animation: dk-breathe 1.8s ease-in-out infinite;
      }
      .dk-eyes {
        transform-origin: 0 -93.8px;
        animation: dk-blink 2.6s ease-in-out infinite;
      }
      .dk-shadow-el {
        transform-origin: 0 2px;
        animation: dk-shadow 1.8s ease-in-out infinite;
      }
      .dk-ear-left {
        transform-origin: -74.2px -105.3px;
        animation: dk-ear-l 1.8s ease-in-out infinite;
      }
      .dk-ear-right {
        transform-origin: 74.2px -105.3px;
        animation: dk-ear-r 1.8s ease-in-out infinite;
      }
    </style>
  </defs>

  <!-- 底部阴影 -->
  <ellipse class="dk-shadow-el" cy="2" rx="36" ry="7" fill="#1b1d4d" opacity="0.14"/>

  <!-- 完整身体与头部容器（带呼吸起伏） -->
  <g class="dk-body-wrap">
    <!-- 两只小蓝鞋 -->
    <path class="dk-l" d="M-19.3 -18.5 C-24.8 -18.5 -28.1 -16 -32.8 -11.3 C-36.7 -7.4 -38.9 -4.9 -35.8 -2.3 C-31.5 1.4 -24.1 1.1 -18.2 -2 C-12.1 -4.9 -8.5 -9.2 -12.1 -14.8 C-13.9 -17.6 -16.2 -18.5 -19.3 -18.5Z" fill="#2f79f7"/>
    <path class="dk-l" d="M-19.3 -18.5 C-24.8 -18.5 -28.1 -16 -32.8 -11.3 C-36.7 -7.4 -38.9 -4.9 -35.8 -2.3 C-31.5 1.4 -24.1 1.1 -18.2 -2 C-12.1 -4.9 -8.5 -9.2 -12.1 -14.8 C-13.9 -17.6 -16.2 -18.5 -19.3 -18.5Z" fill="#2f79f7" transform="scale(-1 1)"/>

    <!-- 躯干 -->
    <path d="M-37.4 -65.7 C-29.7 -61 -25.2 -54.2 -25.2 -46.8 C-25.2 -40.5 -28.8 -35.3 -28.8 -28.4 C-28.8 -18.4 -20.7 -13.5 -10.8 -13.5 L10.8 -13.5 C20.7 -13.5 28.8 -18.4 28.8 -28.4 C28.8 -35.3 25.2 -40.5 25.2 -46.8 C25.2 -54.2 29.7 -61 37.4 -65.7 L37.4 -75.2 L-37.4 -75.2Z" fill="#ff97bf"/>
    <path class="dk-l" d="M-37.4 -65.7 C-29.7 -61 -25.2 -54.2 -25.2 -46.8 C-25.2 -40.5 -28.8 -35.3 -28.8 -28.4 C-28.8 -18.4 -20.7 -13.5 -10.8 -13.5 L10.8 -13.5 C20.7 -13.5 28.8 -18.4 28.8 -28.4 C28.8 -35.3 25.2 -40.5 25.2 -46.8 C25.2 -54.2 29.7 -61 37.4 -65.7" fill="none"/>
    
    <!-- 浅色小肚皮 -->
    <ellipse class="dk-l" cy="-32" rx="17.8" ry="13.5" fill="#fff3e4"/>

    <!-- 左耳 -->
    <g class="dk-ear-left">
      <ellipse class="dk-l" cx="-74.2" cy="-105.3" rx="31" ry="31.3" fill="#ff97bf"/>
      <ellipse class="dk-l" cx="-74.2" cy="-105.3" rx="21.1" ry="22" fill="#ffe6f0"/>
    </g>

    <!-- 右耳 -->
    <g class="dk-ear-right">
      <ellipse class="dk-l" cx="74.2" cy="-105.3" rx="31" ry="31.3" fill="#ff97bf"/>
      <ellipse class="dk-l" cx="74.2" cy="-105.3" rx="21.1" ry="22" fill="#ffe6f0"/>
    </g>

    <!-- 脑袋轮廓 -->
    <path d="M-37.4 -65.7 C-49.7 -73.1 -56.3 -82.1 -56.3 -98.5 C-56.3 -129.6 -32.9 -149.2 0 -149.2 C32.9 -149.2 56.3 -129.6 56.3 -98.5 C56.3 -82.1 49.7 -73.1 37.4 -65.7 L0 -70.2Z" fill="#ff97bf"/>
    <path class="dk-l" d="M-37.4 -65.7 C-49.7 -73.1 -56.3 -82.1 -56.3 -98.5 C-56.3 -129.6 -32.9 -149.2 0 -149.2 C32.9 -149.2 56.3 -129.6 56.3 -98.5 C56.3 -82.1 49.7 -73.1 37.4 -65.7" fill="none"/>

    <!-- 脸颊白色区域 -->
    <path class="dk-l" d="M0 -133 C29.7 -133 48.2 -121.7 48.2 -96.5 C48.2 -71.3 25.7 -61.2 0 -61.2 C-25.7 -61.2 -48.2 -71.3 -48.2 -96.5 C-48.2 -121.7 -29.7 -133 0 -133Z" fill="#fff3e4"/>

    <!-- 腮红与眉毛 -->
    <ellipse cx="-30.6" cy="-78.5" rx="4.3" ry="2.7" fill="#ffe6f0"/>
    <ellipse class="dk-l" cx="-13.5" cy="-111.2" rx="3.1" ry="1.8" fill="#ff97bf"/>
    <ellipse cx="30.6" cy="-78.5" rx="4.3" ry="2.7" fill="#ffe6f0"/>
    <ellipse class="dk-l" cx="13.5" cy="-111.2" rx="3.1" ry="1.8" fill="#ff97bf"/>

    <!-- 眼睛（带眨眼动画） -->
    <g class="dk-eyes">
      <g transform="translate(-23.4 -93.8)"><circle r="11.2" fill="#fff" class="dk-t"/><circle class="dk-t" r="8.6" fill="#ff97bf"/></g>
      <g transform="translate(23.4 -93.8)"><circle r="11.2" fill="#fff" class="dk-t"/><circle class="dk-t" r="8.6" fill="#ff97bf"/></g>
    </g>

    <!-- 微笑嘴巴 -->
    <g transform="translate(0 -79)"><path d="M-8.1 -1.3 C-4.9 3 4.9 3 8.1 -1.3" fill="none" class="dk-l"/></g>

    <!-- 两只小圆手 -->
    <circle class="dk-l" cx="-37.8" cy="-34.7" r="9.7" fill="#ff97bf"/>
    <circle class="dk-l" cx="37.8" cy="-34.7" r="9.7" fill="#ff97bf"/>
  </g>
</svg>